# Real-stack Playwright E2E (Next + FastAPI + Postgres). Not part of the default PR gate.
# Use workflow_dispatch for staging verification or cron for nightly signal.

name: E2E Real Stack

on:
  workflow_dispatch:
  schedule:
    # 05:15 UTC daily — adjust for your ops window
    - cron: "15 5 * * *"

concurrency:
  group: e2e-real-stack-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  playwright-real-stack:
    name: Playwright (real stack)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: botforge_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d botforge_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENVIRONMENT: local
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/botforge_e2e
      JWT_SECRET_KEY: e2e-workflow-jwt-secret-min-32-chars-x
      # Placeholder is enough when E2E_WIDGET_CHAT=0. Override in repo env if you enable widget chat.
      GEMINI_API_KEY: e2e-workflow-gemini-placeholder
      E2E_WIDGET_CHAT: "0"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Enforce Python 3.12
        run: python scripts/check_python_version.py

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Alembic upgrade
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/botforge_e2e
        run: alembic upgrade head

      - name: Seed E2E workspace
        run: python scripts/seed_e2e_stack.py --output frontend/e2e/real-stack/seed-output.json

      - name: Start FastAPI
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:8000/api/v1/health && exit 0
            sleep 2
          done
          echo "API failed to become healthy"
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install chromium --with-deps

      - name: Run real-stack E2E
        working-directory: frontend
        run: npm run test:e2e:real
        env:
          CI: true

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-real-stack-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            frontend/test-results/real-stack
            frontend/playwright-report
          if-no-files-found: warn
