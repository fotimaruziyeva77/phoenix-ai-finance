# Immutable release images: tag push v* → build and push to GHCR with semver + SHA tags.
# Does not deploy anywhere (promote the digest via your staging/production process).

name: Release image

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-push-tagged:
    name: Build and push (semver + SHA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image path (lowercase)
        id: im
        shell: bash
        run: echo "path=${GITHUB_REPOSITORY,,}/api" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.im.outputs.path }}:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ steps.im.outputs.path }}:${{ github.sha }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            SENTRY_RELEASE=${{ github.ref_name }}@${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image summary
        shell: bash
        run: |
          echo "### Published images" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${{ env.REGISTRY }}/${{ steps.im.outputs.path }}:${{ github.ref_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${{ env.REGISTRY }}/${{ steps.im.outputs.path }}:${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
