[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    integration: requires host-reachable PostgreSQL (TEST_DATABASE_URL or DATABASE_URL without @postgres:); run in CI via .github/workflows/ci.yml (backend-integration job)
    knowledge_api: bot knowledge file HTTP tests (subset of integration; see test_bot_knowledge_files_api_integration)
    knowledge_processing: PDF text extraction pipeline (see test_knowledge_file_processing_integration)
    knowledge_retrieval: bot-scoped FTS retrieval (see test_knowledge_retrieval_integration)
    ai_knowledge_chat: AI chat + knowledge RAG integration (see test_ai_knowledge_chat_integration)
    knowledge_safety: isolation + validation guardrails (see test_knowledge_safety_isolation)
    mvp_journey: single-chain MVP product verification (see test_mvp_product_journey_integration)
    knowledge_ingestion_e2e: async upload→queue→worker→Postgres→retrieval (see test_knowledge_ingestion_integration)
    telegram_provisioning_e2e: real TelegramConfigService + DB; Telegram HTTP sandboxed (see test_telegram_provisioning_e2e_integration)
